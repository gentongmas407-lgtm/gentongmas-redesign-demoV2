<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Data Pelanggan - Gentong Mas</title>
    
    <!-- Favicon (Logo Tab Browser) -->
    <link rel="icon" type="image/webp" href="gentongmas-images/gentongmas-logo-new.webp">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .brand-header-img {
            max-width: 80px;
            height: auto;
        }
    </style>
</head>
<body class="bg-light p-3 p-md-4">

<div class="container bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
    
    <!-- HEADER LOGO GENTONG MAS -->
    <div class="text-center mb-4">
        <img src="gentongmas-images/gentongmas-logo-new.webp" alt="Logo Gentong Mas" class="brand-header-img mb-2">
        <h4 class="fw-bold m-0" style="color: #2c3e50;">Gentong Mas</h4>
        <p class="text-muted small">Lengkapi Data Pengiriman Anda</p>
    </div>

    <form id="customerForm">
        <!-- Data Diri -->
        <div class="mb-3">
            <label for="fullName" class="form-label fw-semibold">Nama Lengkap</label>
            <input type="text" class="form-control" id="fullName" required placeholder="Contoh: Budi Santoso">
        </div>

        <div class="mb-3">
            <label for="phoneNumber" class="form-label fw-semibold">No. WhatsApp</label>
            <input type="tel" class="form-control" id="phoneNumber" required placeholder="Contoh: 08123456789">
        </div>

        <!-- Cascading Select Alamat -->
        <div class="mb-3">
            <label for="province" class="form-label fw-semibold">Provinsi</label>
            <select class="form-select" id="province" required>
                <option value="" selected disabled>Pilih Provinsi...</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="city" class="form-label fw-semibold">Kabupaten / Kota</label>
            <select class="form-select" id="city" required disabled>
                <option value="" selected disabled>Pilih Kabupaten/Kota...</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="district" class="form-label fw-semibold">Kecamatan</label>
            <select class="form-select" id="district" required disabled>
                <option value="" selected disabled>Pilih Kecamatan...</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="subdistrict" class="form-label fw-semibold">Desa / Kelurahan</label>
            <select class="form-select" id="subdistrict" required disabled>
                <option value="" selected disabled>Pilih Desa/Kelurahan...</option>
            </select>
        </div>

        <div class="row">
            <div class="col-md-8 mb-3">
                <label for="addressDetail" class="form-label fw-semibold">Alamat Lengkap (Jalan, RT/RW, No. Rumah)</label>
                <textarea class="form-control" id="addressDetail" rows="2" required placeholder="Jl. Mawar No. 12, RT 01/RW 02"></textarea>
            </div>
            <div class="col-md-4 mb-3">
                <label for="postalCode" class="form-label fw-semibold">Kode Pos</label>
                <input type="text" class="form-control" id="postalCode" required placeholder="45123">
            </div>
        </div>

        <button type="submit" class="btn btn-success w-100 mt-3 py-2 fw-bold" id="submitBtn">Lanjut Pilih Produk</button>
    </form>
</div>

<!-- JavaScript Logic Supabase & API Wilayah -->
<script>
    const SUPABASE_URL = 'https://rbmnglczobisuzmyeesf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJibW5nbGN6b2Jpc3V6bXllZXNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MDY4ODgsImV4cCI6MjEwNjE4Mjg4OH0.E_XJNgFcJpk1nW_gerUCD-QpFGsEFlyG3fLDJ8-fLpg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const API_BASE_URL = 'https://www.emsifa.com/api-wilayah-indonesia/api';

    const provinceSelect = document.getElementById('province');
    const citySelect = document.getElementById('city');
    const districtSelect = document.getElementById('district');
    const subdistrictSelect = document.getElementById('subdistrict');
    const submitBtn = document.getElementById('submitBtn');

    function resetSelect(selectElement, placeholder) {
        selectElement.innerHTML = `<option value="" selected disabled>${placeholder}</option>`;
        selectElement.disabled = true;
    }

    // Load Provinsi
    fetch(`${API_BASE_URL}/provinces.json`)
        .then(response => response.json())
        .then(provinces => {
            provinces.forEach(prov => {
                provinceSelect.innerHTML += `<option value="${prov.id}" data-name="${prov.name}">${prov.name}</option>`;
            });
        });

    provinceSelect.addEventListener('change', function() {
        resetSelect(citySelect, 'Pilih Kabupaten/Kota...');
        resetSelect(districtSelect, 'Pilih Kecamatan...');
        resetSelect(subdistrictSelect, 'Pilih Desa/Kelurahan...');

        fetch(`${API_BASE_URL}/regencies/${this.value}.json`)
            .then(response => response.json())
            .then(cities => {
                citySelect.disabled = false;
                cities.forEach(city => {
                    citySelect.innerHTML += `<option value="${city.id}" data-name="${city.name}">${city.name}</option>`;
                });
            });
    });

    citySelect.addEventListener('change', function() {
        resetSelect(districtSelect, 'Pilih Kecamatan...');
        resetSelect(subdistrictSelect, 'Pilih Desa/Kelurahan...');

        fetch(`${API_BASE_URL}/districts/${this.value}.json`)
            .then(response => response.json())
            .then(districts => {
                districtSelect.disabled = false;
                districts.forEach(dist => {
                    districtSelect.innerHTML += `<option value="${dist.id}" data-name="${dist.name}">${dist.name}</option>`;
                });
            });
    });

    districtSelect.addEventListener('change', function() {
        resetSelect(subdistrictSelect, 'Pilih Desa/Kelurahan...');

        fetch(`${API_BASE_URL}/villages/${this.value}.json`)
            .then(response => response.json())
            .then(villages => {
                subdistrictSelect.disabled = false;
                villages.forEach(village => {
                    subdistrictSelect.innerHTML += `<option value="${village.id}" data-name="${village.name}">${village.name}</option>`;
                });
            });
    });

    // Submit ke Supabase
    document.getElementById('customerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerText = 'Menyimpan data...';

        const customerData = {
            full_name: document.getElementById('fullName').value,
            phone_number: document.getElementById('phoneNumber').value,
            province: provinceSelect.options[provinceSelect.selectedIndex].getAttribute('data-name'),
            city: citySelect.options[citySelect.selectedIndex].getAttribute('data-name'),
            district: districtSelect.options[districtSelect.selectedIndex].getAttribute('data-name'),
            subdistrict: subdistrictSelect.options[subdistrictSelect.selectedIndex].getAttribute('data-name'),
            address_detail: document.getElementById('addressDetail').value,
            postal_code: document.getElementById('postalCode').value
        };

        try {
            const { data, error } = await supabaseClient
                .from('customers')
                .insert([customerData]);

            if (error) {
                console.error('Supabase Error:', error);
                alert('Gagal menyimpan data: ' + error.message);
            } else {
                localStorage.setItem('gentongmas_customer', JSON.stringify(customerData));
                alert('Data pengiriman berhasil tersimpan!');
                window.location.href = 'produk.html';
            }
        } catch (err) {
            console.error('System Error:', err);
            alert('Terjadi kesalahan koneksi.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Lanjut Pilih Produk';
        }
    });
</script>

</body>
</html>
